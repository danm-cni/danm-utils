apiVersion: v1
kind: ServiceAccount
metadata:
  name: svcwatcher
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: svcwatcher
  namespace: kube-system
  labels:
    danm.io: svcwatcher
spec:
  selector:
    matchLabels:
      danm.io: svcwatcher
  template:
    metadata:
      labels:
        danm.io: svcwatcher
    spec:
      serviceAccountName: svcwatcher
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      terminationGracePeriodSeconds: 15
      dnsPolicy: ClusterFirst
      containers:
      - name: svcwatcher
        image: svcwatcher
        imagePullPolicy: IfNotPresent
