apiVersion: v1
kind: ServiceAccount
metadata:
  name: danm-webhook
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: danm-webhook-deployment
  namespace: kube-system
  labels:
    danm: webhook
spec:
  selector:
    matchLabels:
      danm: webhook
  template:
    metadata:
      name: danm-webhook
      labels:
        danm: webhook
    spec:
      serviceAccountName: danm-webhook
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      terminationGracePeriodSeconds: 15
      dnsPolicy: ClusterFirst
      containers:
      - name: danm-webhook
        image: webhook
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/webhook", "-tls-cert-bundle=/etc/webhook/certs/cert", "-tls-private-key-file=/etc/webhook/certs/key", "bind-port=8443"]
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: danm-webhook-certs
