apiVersion: v1
kind: ServiceAccount
metadata:
  name: dma
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: danm:dma
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs: [ "*" ]
- apiGroups:
  - danm.k8s.io
  - danm.io
  resources:
  - "*"
  verbs: [ "*" ]
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs: [ "*" ]
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  verbs: [ "*" ]
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - statefulsets
  - replicasets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - create
  - delete
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs: [ "*" ]
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - services
  - secrets
  - serviceaccounts
  verbs:
  - get
  - list
  - patch
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: danm:dma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: danm:dma
subjects:
- kind: ServiceAccount
  name: dma
  namespace: kube-system
---
apiVersion: v1
kind: Pod
metadata:
  name: dma
  namespace: kube-system
  labels:
    danm.io: dma
spec:
  serviceAccountName: dma
  restartPolicy: Never
  priorityClassName: system-cluster-critical
  nodeSelector:
    "node-role.kubernetes.io/control-plane": ""
  tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists
  terminationGracePeriodSeconds: 15
  dnsPolicy: ClusterFirst
  containers:
  - name: dma
    # Replace with the dma image of your registry, built by build_dma.sh
    image: dma:latest
    imagePullPolicy: IfNotPresent
    # The assistant is driven with "kubectl exec", so the container only has to stay alive
    command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    env:
    - name: DMA_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: DMA_POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
